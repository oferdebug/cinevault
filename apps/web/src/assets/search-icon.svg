<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="searchGradient" x1="40" y1="30" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DDFFF"/>
      <stop offset="100%" stop-color="#22C7FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="85" cy="85" r="58" stroke="url(#searchGradient)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="124" y1="124" x2="170" y2="170" stroke="url(#searchGradient)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
</svg>
