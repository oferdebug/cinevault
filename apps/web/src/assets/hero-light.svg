<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Cinematic stage light effect" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9fdcff" stop-opacity="1"/>
      <stop offset="35%"  stop-color="#3aa1ec" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%"  stop-color="#bfeaff" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#3aa1ec" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spotlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#bfeaff" stop-opacity="0.7"/>
      <stop offset="55%"  stop-color="#3aa1ec" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a3a8a" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#5fc8ff" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#5fc8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="horizonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#6ec9ff" stop-opacity="0.55"/>
      <stop offset="55%"  stop-color="#1d68c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topBloom" cx="0.5" cy="0.2" r="0.6">
      <stop offset="0%"   stop-color="#cdf0ff" stop-opacity="0.95"/>
      <stop offset="25%"  stop-color="#5fc1ff" stop-opacity="0.55"/>
      <stop offset="65%"  stop-color="#1d68c4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bigCol" cx="0.5" cy="0" r="0.7">
      <stop offset="0%"   stop-color="#3aa1ec" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#1d68c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a3a8a" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="medBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="bigBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Atmospheric column -->
  <ellipse cx="960" cy="0" rx="720" ry="780" fill="url(#bigCol)"/>
  <ellipse cx="960" cy="0" rx="500" ry="600" fill="url(#topBloom)"/>

  <!-- Soft blurred backing beams -->
  <g filter="url(#medBlur)" opacity="0.85">
    <rect x="930" y="0" width="60"  height="500" fill="url(#beam)"/>
    <rect x="850" y="0" width="40"  height="460" fill="url(#beam)" opacity="0.6"/>
    <rect x="1030" y="0" width="40" height="460" fill="url(#beam)" opacity="0.6"/>
    <rect x="780" y="0" width="30"  height="430" fill="url(#beam)" opacity="0.45"/>
    <rect x="1110" y="0" width="30" height="430" fill="url(#beam)" opacity="0.45"/>
    <rect x="710" y="0" width="25"  height="400" fill="url(#beam)" opacity="0.35"/>
    <rect x="1185" y="0" width="25" height="400" fill="url(#beam)" opacity="0.35"/>
  </g>

  <!-- Sharp foreground beams -->
  <g opacity="0.95">
    <rect x="956" y="0" width="8"  height="540" fill="url(#beamHot)" filter="url(#softBlur)"/>
    <rect x="958" y="0" width="3"  height="560" fill="#ffffff" opacity="0.9"/>
    <rect x="935" y="0" width="3"  height="510" fill="url(#beam)" opacity="0.95"/>
    <rect x="982" y="0" width="3"  height="510" fill="url(#beam)" opacity="0.95"/>
    <rect x="912" y="0" width="2"  height="480" fill="url(#beam)" opacity="0.85"/>
    <rect x="1006" y="0" width="2" height="480" fill="url(#beam)" opacity="0.85"/>
    <rect x="894" y="0" width="3"  height="470" fill="url(#beam)" opacity="0.8" filter="url(#softBlur)"/>
    <rect x="1023" y="0" width="3" height="470" fill="url(#beam)" opacity="0.8" filter="url(#softBlur)"/>
    <rect x="870" y="0" width="2"  height="460" fill="url(#beam)" opacity="0.7"/>
    <rect x="1048" y="0" width="2" height="460" fill="url(#beam)" opacity="0.7"/>
    <rect x="848" y="0" width="2"  height="440" fill="url(#beam)" opacity="0.6"/>
    <rect x="1070" y="0" width="2" height="440" fill="url(#beam)" opacity="0.6"/>
    <rect x="822" y="0" width="2"  height="425" fill="url(#beam)" opacity="0.55"/>
    <rect x="1098" y="0" width="2" height="425" fill="url(#beam)" opacity="0.55"/>
    <rect x="800" y="0" width="2"  height="410" fill="url(#beam)" opacity="0.5"/>
    <rect x="1120" y="0" width="2" height="410" fill="url(#beam)" opacity="0.5"/>
    <rect x="775" y="0" width="2"  height="395" fill="url(#beam)" opacity="0.42"/>
    <rect x="1145" y="0" width="2" height="395" fill="url(#beam)" opacity="0.42"/>
    <rect x="752" y="0" width="2"  height="380" fill="url(#beam)" opacity="0.36"/>
    <rect x="1170" y="0" width="2" height="380" fill="url(#beam)" opacity="0.36"/>
    <rect x="725" y="0" width="2"  height="365" fill="url(#beam)" opacity="0.3"/>
    <rect x="1196" y="0" width="2" height="365" fill="url(#beam)" opacity="0.3"/>
    <rect x="700" y="0" width="2"  height="345" fill="url(#beam)" opacity="0.24"/>
    <rect x="1222" y="0" width="2" height="345" fill="url(#beam)" opacity="0.24"/>
    <rect x="675" y="0" width="2"  height="325" fill="url(#beam)" opacity="0.2"/>
    <rect x="1248" y="0" width="2" height="325" fill="url(#beam)" opacity="0.2"/>
  </g>

  <!-- Side diagonal spotlights (blurred) -->
  <g filter="url(#bigBlur)">
    <polygon points="-40,-40 -40,200 760,560 820,520" fill="url(#spotlight)" opacity="0.85"/>
    <polygon points="1960,-40 1960,200 1160,560 1100,520" fill="url(#spotlight)" opacity="0.85"/>
  </g>
  <g filter="url(#medBlur)" opacity="0.6">
    <polygon points="0,20 0,140 700,510 740,490" fill="url(#spotlight)"/>
    <polygon points="1920,20 1920,140 1220,510 1180,490" fill="url(#spotlight)"/>
  </g>

  <!-- Horizon halo + curve -->
  <ellipse cx="960" cy="540" rx="1100" ry="80" fill="url(#horizonHalo)" filter="url(#bigBlur)"/>
  <ellipse cx="960" cy="540" rx="700"  ry="40" fill="url(#horizonHalo)" filter="url(#medBlur)" opacity="0.8"/>
  <path d="M 60,560 Q 960,460 1860,560" fill="none" stroke="url(#horizonLine)" stroke-width="10" stroke-linecap="round" filter="url(#medBlur)" opacity="0.7"/>
  <path d="M 60,560 Q 960,460 1860,560" fill="none" stroke="url(#horizonLine)" stroke-width="4"  stroke-linecap="round" filter="url(#softBlur)"/>
  <path d="M 80,560 Q 960,464 1840,560" fill="none" stroke="url(#horizonLine)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center kiss of light -->
  <ellipse cx="960" cy="500" rx="220" ry="10"  fill="#ffffff" opacity="0.55" filter="url(#medBlur)"/>
  <ellipse cx="960" cy="500" rx="100" ry="3"   fill="#ffffff" opacity="0.95" filter="url(#softBlur)"/>
  <ellipse cx="960" cy="500" rx="50"  ry="1.5" fill="#ffffff" opacity="1"/>

  <!-- Stars / dust -->
  <g fill="#bfeaff">
    <circle cx="220"  cy="640" r="1.4" opacity="0.85"/>
    <circle cx="380"  cy="720" r="1"   opacity="0.7"/>
    <circle cx="510"  cy="660" r="1.2" opacity="0.8"/>
    <circle cx="640"  cy="780" r="1.5" opacity="0.9"/>
    <circle cx="780"  cy="700" r="0.9" opacity="0.65"/>
    <circle cx="420"  cy="850" r="1.1" opacity="0.75"/>
    <circle cx="180"  cy="820" r="1.3" opacity="0.85"/>
    <circle cx="320"  cy="950" r="1"   opacity="0.7"/>
    <circle cx="600"  cy="900" r="1.2" opacity="0.8"/>
    <circle cx="850"  cy="870" r="0.9" opacity="0.65"/>
    <circle cx="1120" cy="700" r="1.2" opacity="0.8"/>
    <circle cx="1280" cy="660" r="1.4" opacity="0.9"/>
    <circle cx="1410" cy="780" r="1"   opacity="0.7"/>
    <circle cx="1550" cy="720" r="1.3" opacity="0.85"/>
    <circle cx="1700" cy="690" r="0.9" opacity="0.65"/>
    <circle cx="1450" cy="870" r="1.1" opacity="0.75"/>
    <circle cx="1620" cy="900" r="1"   opacity="0.7"/>
    <circle cx="1780" cy="830" r="1.2" opacity="0.8"/>
    <circle cx="1320" cy="950" r="1.3" opacity="0.85"/>
    <circle cx="1100" cy="920" r="0.9" opacity="0.65"/>
    <circle cx="960"  cy="780" r="1"   opacity="0.7"/>
    <circle cx="900"  cy="980" r="0.9" opacity="0.65"/>
    <circle cx="1020" cy="1010" r="1.1" opacity="0.75"/>
    <circle cx="700"  cy="1020" r="1"   opacity="0.7"/>
    <circle cx="1230" cy="1000" r="1.2" opacity="0.8"/>
  </g>
</svg>
